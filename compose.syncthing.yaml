# Optional private-LAN vault synchronization between the Ubuntu server and Mac.
# The GUI is localhost-only. Peer sync uses mutually approved Syncthing device IDs.
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing@sha256:9e9b931bf48a8a08bffaaa7e2fc2b7d0126b02def2bf1d3395d9b531817f9af3
    hostname: hermes-vault
    environment:
      PUID: ${SYNCTHING_PUID}
      PGID: ${SYNCTHING_PGID}
      TZ: ${TZ:-Europe/Zurich}
      UMASK: "007"
    volumes:
      - ${SYNCTHING_CONFIG_PATH}:/config:rw
      - ${OBSIDIAN_VAULT_PATH}:/data/vault:rw
    ports:
      # Administration UI: only through local browser / SSH tunnel.
      - "127.0.0.1:${SYNCTHING_GUI_PORT:-8384}:8384"
      # Sync transport and local discovery: private LAN only; restrict with host firewall.
      - "${SYNCTHING_LISTEN_BIND:-0.0.0.0}:${SYNCTHING_LISTEN_PORT:-22000}:22000/tcp"
      - "${SYNCTHING_LISTEN_BIND:-0.0.0.0}:${SYNCTHING_LISTEN_PORT:-22000}:22000/udp"
      - "${SYNCTHING_LISTEN_BIND:-0.0.0.0}:${SYNCTHING_DISCOVERY_PORT:-21027}:21027/udp"
    networks:
      - syncthing-net
    restart: unless-stopped

networks:
  syncthing-net:
    driver: bridge
