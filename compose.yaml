name: honcho-hermes

x-honcho-common: &honcho-common
  build:
    context: ./honcho
    dockerfile: Dockerfile
  env_file: .env
  environment:
    DB_CONNECTION_URI: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    CACHE_ENABLED: "true"
    CACHE_URL: redis://redis:6379/0?suppress=true
  extra_hosts:
    # Lets a Linux Docker host reach a native host Ollama too.
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  embedding-schema:
    <<: *honcho-common
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /app/.venv/bin/alembic upgrade head
        exec /app/.venv/bin/python scripts/configure_embeddings.py --yes
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    <<: *honcho-common
    entrypoint: ["sh", "docker/entrypoint.sh"]
    depends_on:
      embedding-schema:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HONCHO_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  deriver:
    <<: *honcho-common
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on:
      api:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "max_connections=100"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./honcho/database/init.sql:/docker-entrypoint-initdb.d/10-enable-pgvector.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8.2
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
